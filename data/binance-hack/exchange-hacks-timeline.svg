<svg viewBox="0 0 480 522" width="480" height="522" style="width:100%;max-width:560px;height:auto" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="16"><title>What happened to customers' money after six big crypto exchange failures</title><line x1="74" x2="74" y1="20" y2="508.0" stroke="#e2e8f0" stroke-width="2"/><text x="52" y="32.0" text-anchor="end" fill="#475569" font-weight="600">2014</text><circle cx="74" cy="27.0" r="7" fill="#eb6834" stroke="#fff" stroke-width="3"/><text x="92" y="32.0" fill="#0f172a" font-weight="600">Mt. Gox collapses after losing about</text><text x="92" y="52.0" fill="#0f172a" font-weight="600">850,000 bitcoin</text><text x="92" y="72.0" fill="#475569" font-size="15">Creditors started getting coins back in July</text><text x="92" y="91.0" fill="#475569" font-size="15">2024, ten years later</text><text x="52" y="136.0" text-anchor="end" fill="#475569" font-weight="600">2016</text><circle cx="74" cy="131.0" r="7" fill="#eda100" stroke="#fff" stroke-width="3"/><text x="92" y="136.0" fill="#0f172a" font-weight="600">Bitfinex hack, about 120,000 bitcoin</text><text x="92" y="156.0" fill="#475569" font-size="15">Every account took a 36% cut, repaid with</text><text x="92" y="175.0" fill="#475569" font-size="15">tokens bought back by April 2017</text><text x="52" y="220.0" text-anchor="end" fill="#475569" font-weight="600">2019</text><circle cx="74" cy="215.0" r="7" fill="#1baf7a" stroke="#fff" stroke-width="3"/><text x="92" y="220.0" fill="#0f172a" font-weight="600">Binance hot-wallet hack, about 7,000</text><text x="92" y="240.0" fill="#0f172a" font-weight="600">bitcoin</text><text x="92" y="260.0" fill="#475569" font-size="15">Covered in full from Binance's own SAFU fund</text><text x="52" y="305.0" text-anchor="end" fill="#475569" font-weight="600">2022</text><circle cx="74" cy="300.0" r="7" fill="#eda100" stroke="#fff" stroke-width="3"/><text x="92" y="305.0" fill="#0f172a" font-weight="600">FTX collapses</text><text x="92" y="325.0" fill="#475569" font-size="15">Small creditors got 119% of their Nov. 2022</text><text x="92" y="344.0" fill="#475569" font-size="15">dollar value in Feb. 2025</text><text x="52" y="389.0" text-anchor="end" fill="#475569" font-weight="600">2025</text><circle cx="74" cy="384.0" r="7" fill="#1baf7a" stroke="#fff" stroke-width="3"/><text x="92" y="389.0" fill="#0f172a" font-weight="600">Bybit hack, about $1.5 billion</text><text x="92" y="409.0" fill="#475569" font-size="15">Bybit says it closed the gap within days</text><text x="52" y="454.0" text-anchor="end" fill="#475569" font-weight="600">2026</text><circle cx="74" cy="449.0" r="7" fill="#eda100" stroke="#fff" stroke-width="3"/><text x="92" y="454.0" fill="#0f172a" font-weight="600">Binance hack, about $6.3 billion</text><text x="92" y="474.0" fill="#475569" font-size="15">Binance says about 95% is covered and is</text><text x="92" y="493.0" fill="#475569" font-size="15">reopening withdrawals in phases</text></svg>