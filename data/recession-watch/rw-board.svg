<svg viewBox="0 0 480 198" width="480" height="198" style="width:100%;max-width:560px;height:auto" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="16"><title>Three recession warning lights, as of early November 2026</title><text x="16" y="32.0" fill="#475569" font-size="14">Sahm rule (unemployment)</text><rect x="16" y="44.0" width="448.0" height="6" rx="3" fill="#e2e8f0"/><rect x="240.0" y="44.0" width="224.0" height="6" fill="#fed7aa"/><line x1="240.0" x2="240.0" y1="38.0" y2="56.0" stroke="#ea580c" stroke-width="2"/><circle cx="16.0" cy="47.0" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="26.0" y="70.0" text-anchor="start" fill="#2563eb" font-size="13" font-weight="600">Zero · lights at 0.5</text><text x="16" y="90.0" fill="#475569" font-size="14">Jobless claims vs. 1-year low</text><rect x="16" y="102.0" width="448.0" height="6" rx="3" fill="#e2e8f0"/><rect x="240.0" y="102.0" width="224.0" height="6" fill="#fed7aa"/><line x1="240.0" x2="240.0" y1="96.0" y2="114.0" stroke="#ea580c" stroke-width="2"/><circle cx="16.0" cy="105.0" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="26.0" y="128.0" text-anchor="start" fill="#2563eb" font-size="13" font-weight="600">At the low · lights at +20%</text><text x="16" y="148.0" fill="#475569" font-size="14">Chance of recession within a year</text><rect x="16" y="160.0" width="448.0" height="6" rx="3" fill="#e2e8f0"/><rect x="165.3" y="160.0" width="298.7" height="6" fill="#fed7aa"/><line x1="165.3" x2="165.3" y1="154.0" y2="172.0" stroke="#ea580c" stroke-width="2"/><circle cx="83.2" cy="163.0" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="93.2" y="186.0" text-anchor="start" fill="#2563eb" font-size="13" font-weight="600">9% · lights at 20-30%</text></svg>