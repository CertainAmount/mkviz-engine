<svg viewBox="0 0 480 456" width="480" height="456" style="width:100%;max-width:560px;height:auto" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="16"><title>The yearly gas calendar: the federal summer-fuel rule and driving season</title><line x1="104" x2="104" y1="20" y2="442.0" stroke="#e2e8f0" stroke-width="2"/><text x="82" y="32.0" text-anchor="end" fill="#475569" font-weight="600">May 1</text><circle cx="104" cy="27.0" r="7" fill="#eda100" stroke="#fff" stroke-width="3"/><text x="122" y="32.0" fill="#0f172a" font-weight="600">Refiners and fuel terminals switch to</text><text x="122" y="52.0" fill="#0f172a" font-weight="600">summer-grade gas</text><text x="122" y="72.0" fill="#475569" font-size="15">The costlier blend starts moving toward</text><text x="122" y="91.0" fill="#475569" font-size="15">stations</text><text x="82" y="136.0" text-anchor="end" fill="#475569" font-weight="600">June 1</text><circle cx="104" cy="131.0" r="7" fill="#eb6834" stroke="#fff" stroke-width="3"/><text x="122" y="136.0" fill="#0f172a" font-weight="600">Stations must sell summer-grade gas</text><text x="122" y="156.0" fill="#475569" font-size="15">Lower-volatility fuel is more expensive to</text><text x="122" y="175.0" fill="#475569" font-size="15">make</text><text x="82" y="220.0" text-anchor="end" fill="#475569" font-weight="600">Summer</text><circle cx="104" cy="215.0" r="7" fill="#eb6834" stroke="#fff" stroke-width="3"/><text x="122" y="220.0" fill="#0f172a" font-weight="600">Driving season</text><text x="122" y="240.0" fill="#475569" font-size="15">The pricier blend is required while people</text><text x="122" y="259.0" fill="#475569" font-size="15">drive the most</text><text x="82" y="304.0" text-anchor="end" fill="#475569" font-weight="600">Sept. 15</text><circle cx="104" cy="299.0" r="7" fill="#1baf7a" stroke="#fff" stroke-width="3"/><text x="122" y="304.0" fill="#0f172a" font-weight="600">Summer rule ends</text><text x="122" y="324.0" fill="#475569" font-size="15">Cheaper winter blends return and prices</text><text x="122" y="343.0" fill="#475569" font-size="15">usually ease</text><text x="82" y="388.0" text-anchor="end" fill="#475569" font-weight="600">Winter</text><circle cx="104" cy="383.0" r="7" fill="#1baf7a" stroke="#fff" stroke-width="3"/><text x="122" y="388.0" fill="#0f172a" font-weight="600">Low season</text><text x="122" y="408.0" fill="#475569" font-size="15">December and January are usually furthest</text><text x="122" y="427.0" fill="#475569" font-size="15">below the year's average</text></svg>